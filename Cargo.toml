[package]
name = "slugaudit-mcp-rust"
version = "1.0.9"
edition = "2024"
# Never published: the license is a non-SPDX PolyForm Noncommercial 1.0.0
# plus the SlugAudit tool-use additional permission, carried in LICENSE via
# `license-file` (cargo's recommended form for non-standard licenses).
# `publish = false` also lets cargo-deny's [licenses] private.ignore exempt
# the root crate from license-expression checks it cannot evaluate.
publish = false
license-file = "LICENSE"
default-run = "slugaudit"

# Product boundary:
# - `slugaudit` is the only end-user executable.
# - The `check_*` binaries are development/CI-only quality tools.
# - Customer projects receive the MCP server binary, which owns only its
#   runtime `.planning/slugaudit/` derived-data directory.

[[bin]]
name = "slugaudit"
path = "src/main.rs"

# Pure-Rust dev tooling: every gate that used to live in tools/*.sh
# (a Python heredoc + bash wrapper) is now a first-class cargo bin. CI's
# workflow calls these directly; locally the same `cargo run --bin <name>`
# is the single entry point. No shell, no Python interpreter required.
#
# Three of the bins are directory-laid-out (`src/bin/<name>/main.rs`) so
# the algorithm and tests fit under the project's 200-LoC source-size
# cap without broad exclusions; the remaining one is a single file.
[[bin]]
name = "check_source_limits"
path = "src/bin/check_source_limits/main.rs"

[[bin]]
name = "check_no_duplicates"
path = "src/bin/check_no_duplicates.rs"

[[bin]]
name = "check_coverage"
path = "src/bin/check_coverage.rs"

[[bin]]
name = "check_docs_drift"
path = "src/bin/check_docs_drift/main.rs"

[[bin]]
name = "check_performance"
path = "src/bin/check_performance/main.rs"

[dependencies]
blake3 = "1"
ignore = "0.4"
notify = "8"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
tree-sitter = "0.26"
tree-sitter-language-pack = "=1.14.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
which = "8"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
temp-env = "0.3.6"
tempfile = "3"

[lints.rust]
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
elided_lifetimes_in_paths = "deny"

[lints.clippy]
print_stdout = "deny"
clone_on_ref_ptr = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

# Criterion benchmarks (Task 9.2). Each bench target is its own binary with
# `harness = false` so criterion provides main(); `cargo test --all-targets`
# compiles them but never runs them, keeping correctness gates separate
# from benchmark builds (plan-audit PHASE-09).
[[bench]]
name = "discovery"
path = "benches/discovery.rs"
harness = false

[[bench]]
name = "parsing"
path = "benches/parsing.rs"
harness = false

[[bench]]
name = "search"
path = "benches/search.rs"
harness = false

# Startup latency (process spawn → first MCP `initialize` response);
# see Task 9.2's last < 1 s target. Black-box bench that spawns the
# compiled `slugaudit-mcp` binary so the measured number is the real
# cold-invoke figure a CI process pays.
[[bench]]
name = "startup"
path = "benches/startup.rs"
harness = false

# Peak-memory in the steady-state sync pipeline (Task 9.2 last < 512 MB
# target). Reads `/proc/self/status` VmHWM on Linux; reports
# "unmeasured" on other OSes so the absence is unambiguous rather than
# silently dropped.
[[bench]]
name = "memory"
path = "benches/memory.rs"
harness = false
