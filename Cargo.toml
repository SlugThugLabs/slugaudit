[package]
name = "slugaudit-mcp-rust"
version = "1.1.0"
edition = "2024"
description = "Read-only MCP server that indexes a project into a queryable evidence index (symbols, call sites, imports, comments, diagnostics) so a coding agent answers structural questions by query instead of re-reading files during an audit, debugging or exploration. It reports evidence only: the agent decides what matters and registers its own signals. The \"Audit\" in the name is the agent's task, not a verdict the tool renders."
# Never published: the license is a non-SPDX PolyForm Noncommercial 1.0.0
# plus the SlugAudit tool-use additional permission, carried in LICENSE via
# `license-file` (cargo's recommended form for non-standard licenses).
# `publish = false` also lets cargo-deny's [licenses] private.ignore exempt
# the root crate from license-expression checks it cannot evaluate.
publish = false
license-file = "LICENSE"
default-run = "slugaudit"

# Product boundary:
# - `slugaudit` is the only end-user executable and the only `[[bin]]` here.
# - The `check_*` gate binaries and the policy tests live in the dev-only
#   workspace crate `crates/gates` (`slugaudit-gates`), never in this package.
# - Customer projects receive the MCP server binary, which owns only its
#   runtime `.planning/slugaudit/` derived-data directory.

[[bin]]
name = "slugaudit"
path = "src/main.rs"

[dependencies]
blake3 = "1"
ignore = "0.4"
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks", "functions", "limits"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
slugplan = { version = "0.1.1", git = "https://github.com/SlugThugLabs/slugplan", tag = "v0.1.1" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.26"
tree-sitter-language-pack = "=1.18.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
which = "8"

[dev-dependencies]
proptest = "1"
slugaudit-test-check = { version = "0.0.0", path = "crates/test_check" }
temp-env = "0.3.6"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints]
workspace = true

# Product package plus the dev-only gates and test helper. `fuzz/` declares its own
# `[workspace]` and is deliberately not a member.
[workspace]
members = [".", "crates/gates", "crates/test_check"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
elided_lifetimes_in_paths = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
print_stdout = "deny"
clone_on_ref_ptr = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
disallowed_methods = "deny"
disallowed_macros = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
