[package]
name = "slugaudit-mcp-rust"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "slugaudit-mcp"
path = "src/main.rs"

[dependencies]
blake3 = "1"
ignore = "0.4"
notify = "7"
rmcp = { version = "2.2", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
tree-sitter = "0.26"
tree-sitter-language-pack = "=1.13.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
which = "7"

[dev-dependencies]
tempfile = "3"
