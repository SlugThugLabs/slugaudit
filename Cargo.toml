[package]
name = "slugaudit-mcp-rust"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "slugaudit-mcp"
path = "src/main.rs"

# Pure-Rust dev tooling: every gate that used to live in tools/*.sh
# (a Python heredoc + bash wrapper) is now a first-class cargo bin. CI's
# workflow calls these directly; locally the same `cargo run --bin <name>`
# is the single entry point. No shell, no Python interpreter required.
#
# Two of the bins are directory-laid-out (`src/bin/<name>/main.rs`) so
# the algorithm and tests fit under the project's 200-LoC source-size
# cap without broad exclusions; the remaining two are single files.
[[bin]]
name = "check_source_limits"
path = "src/bin/check_source_limits/main.rs"

[[bin]]
name = "check_no_duplicates"
path = "src/bin/check_no_duplicates.rs"

[[bin]]
name = "check_coverage"
path = "src/bin/check_coverage.rs"

[[bin]]
name = "check_performance"
path = "src/bin/check_performance/main.rs"

[dependencies]
blake3 = "1"
ignore = "0.4"
notify = "8"
rmcp = { version = "2.2", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
tree-sitter = "0.26"
tree-sitter-language-pack = "=1.14.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
which = "7"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
temp-env = "0.3.6"
tempfile = "3"

# Criterion benchmarks (Task 9.2). Each bench target is its own binary with
# `harness = false` so criterion provides main(); `cargo test --all-targets`
# compiles them but never runs them, keeping correctness gates separate
# from benchmark builds (plan-audit PHASE-09).
[[bench]]
name = "discovery"
path = "benches/discovery.rs"
harness = false

[[bench]]
name = "parsing"
path = "benches/parsing.rs"
harness = false

[[bench]]
name = "search"
path = "benches/search.rs"
harness = false

[[bench]]
name = "sync"
path = "benches/sync.rs"
harness = false
