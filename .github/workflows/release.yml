name: Release

# Cuts the distributable end-user `slugaudit-mcp` binary. The check_* binaries
# are development/CI tools and are not distributed to users.
#
# Gate ownership, so the other workflows do not have to be read alongside this
# one: quality.yml runs fmt, clippy, tests, cargo-deny (advisories, bans,
# sources, licences), coverage and mutation testing on every push/PR;
# `.github/workflows/advisories.yml` re-runs the advisory policy on a weekly
# cron; `.github/workflows/supply-chain.yml` gates the PR diff and scans for
# secrets. `check_performance` is deliberately in none of them — it is a
# local-only gate, and quality.yml carries the reason. This workflow only builds
# the release artifact and attaches it to the GitHub Release, so it stays lean
# and fast.
#
# Every third-party `uses:` here is pinned to the full commit SHA behind its
# release tag, with the version kept as a trailing comment so a human can still
# read what is pinned; `.github/dependabot.yml` proposes the next pin.
#
# Triggered by pushing a tag like `v1.0.0` (the normal path), or manually
# with a tag name via the workflow_dispatch UI. `Cargo.toml`'s version
# must be bumped to match the tag before cutting a release.
#
# Scope: Linux x86_64 only — the platform CI actually verifies, and
# therefore the only one shipped. Additional runners can be added when new
# platforms are supported once those platforms get CI coverage; until then
# shipping binaries for them would be shipping unverified artifacts.
#
# Release hygiene: every artifact ships with a SHA256SUMS file so a
# consumer can verify what they downloaded. The ~450 MB tree-sitter
# parser-sources tarball is downloaded by the build script on cache miss,
# hence the same Swatinem/rust-cache strategy quality.yml uses.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the binaries to (e.g. v1.0.0)"
        required: true

permissions:
  # Needed to attach the binary + checksums to the GitHub Release.
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same branch-pinned action as quality.yml — dtolnay/rust-toolchain
      # publishes no release tags, so this one is re-pinned by hand.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (branch; no releases)
        with:
          toolchain: 1.97.1

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build release binary
        # --locked: the release must match the checked-in Cargo.lock, or
        # the build fails instead of silently resolving differently.
        run: cargo build --release --locked --bin slugaudit

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/slugaudit dist/slugaudit-x86_64-unknown-linux-gnu
          chmod +x dist/slugaudit-x86_64-unknown-linux-gnu
          (cd dist && sha256sum slugaudit-x86_64-unknown-linux-gnu > SHA256SUMS)

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # On a tag push, use the pushed tag; on a manual run, use the
          # operator-supplied tag input.
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          files: dist/*
