name: Supply chain

# The supply-chain gates that look at what a change *introduces*. `quality.yml`
# answers "does this commit build, pass, and stay inside its policies"; this
# workflow answers "does this change introduce a vulnerable dependency, or a
# secret".
#
# Triggered by `pull_request` and by `push` to `main`, and never
# `pull_request_target`. The push trigger exists because the owner is a solo
# developer who commits straight to `main` and opens no PRs: with a PR-only
# trigger these three gates never ran at all. On a push the "change" is the
# range `github.event.before`..`github.sha`; the dependency-review job says how
# it handles that range and its degenerate cases. Nothing here needs a
# repository secret or a write token, so the untrusted-code path stays fully
# isolated: a fork's PR runs this workflow with the default `contents: read`
# token and nothing else. No job uploads SARIF to code scanning, which is why no
# `security-events: write` appears below.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (diff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A push has no PR to take a base from, and the action requires `base-ref`
      # and `head-ref` on any event but `pull_request`/`pull_request_target`
      # (its action.yml at the pinned SHA). So on a push the base is the pre-push
      # tip, `github.event.before`. That is all zeros for a new branch or first
      # push, and may be an object the remote no longer has after a force-push;
      # either way there is no comparable base, and passing would mean "reviewed
      # nothing", so this step fails instead. Fetching the base commit proves it
      # is reachable and fails the job visibly when it is not.
      - name: Require a comparable base (push only)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::push has no previous commit (new branch or first push); the dependency diff cannot be computed, failing rather than skipping" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "$BEFORE" || {
            echo "::error::base commit $BEFORE is unreachable (force-push?); the dependency diff cannot be computed, failing rather than skipping" >&2
            exit 1
          }

      # Reads the base/head dependency diff through the dependency-graph API and
      # fails when the change adds a dependency with a known advisory. This is the
      # diff-scoped half: `cargo-deny` in quality.yml judges the whole graph
      # against `deny.toml`, which cannot say "this change is the commit that
      # added it".
      - name: Review the dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # State the threshold explicitly: the default is `low`, and "any
          # severity" is the intent, not an incidental default.
          fail-on-severity: low
          # The licence half is off on purpose. This repository's licence policy
          # is `deny.toml`'s `[licenses] allow` list, checked by cargo-deny in
          # quality.yml. Enabling GitHub's licence check would create a second
          # allow list that can disagree with the first, and a disagreement
          # between two policies is a policy nobody can read.
          license-check: false
          # Push only: an empty string makes the action use its pull_request
          # defaults, so the PR path is unchanged.
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  vulnerability-scan:
    name: OSV scan (Cargo.lock)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # OSV-Scanner, not CodeQL — and the reason is scope and permissions, not
      # capability. CodeQL does support Rust (GA since October 2025) and would
      # add source-level analysis nothing else here does, but publishing its
      # results needs `security-events: write` plus `actions: read` on the job,
      # i.e. a token scope this workflow deliberately does not take; without the
      # upload its findings are unreachable. OSV-Scanner runs as an ordinary
      # process under `contents: read`, needs no build, and reads `Cargo.lock`
      # in about a second, so the gate costs no compile step. It reads the
      # checked-out lockfile, so it behaves identically on a PR and on a push to
      # `main`. What it adds on the dependency axis (the axis this gate exists
      # for) is OSV.dev's aggregate — GitHub advisories and ecosystem databases
      # alongside RustSec — which is a genuinely different source from the
      # RustSec-database-only cargo-deny policy. Trade-off accepted: findings
      # land in the job log and summary instead of the Security tab.
      - name: Install osv-scanner
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: osv-scanner@2.6.0
          # Refuse the cargo-binstall fallback: this tool is covered by an
          # install-action manifest, so the download comes from its GitHub
          # Release with the SHA256 checksum verified.
          fallback: none

      # Non-zero exit when the lockfile resolves to a known advisory; that exit
      # code is the gate. `--recursive` finds `Cargo.lock` without naming it, so
      # the step keeps working if the workspace ever gains a crate.
      - name: Scan the dependency graph against OSV.dev
        run: osv-scanner scan source --recursive --format table --verbosity error .

  secret-scan:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy, installed by the already-pinned install-action. The two obvious
      # alternatives were rejected for concrete reasons: gitleaks-action v3
      # requires a `GITLEAKS_LICENSE` secret for organization-owned repositories
      # (this repository belongs to an organization) and a fork's PR cannot see
      # repository secrets, so the step would fail for exactly the PRs it is
      # meant to guard; and trufflehog's official action pulls
      # `ghcr.io/trufflesecurity/trufflehog:latest` at run time — an unpinned
      # scanner inside a pinned action — and apt-installs `jq` first. Trivy needs
      # no licence key, and install-action pins its version and verifies the
      # release's SHA256 checksum.
      - name: Install trivy
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: trivy@0.74.0
          fallback: none

      # Coverage boundary, stated so it is not mistaken for completeness: trivy's
      # builtin allow rules skip Markdown by default, and this scans the working
      # tree rather than the history. On a push that means the tree at the pushed
      # commit, not the `before`..`sha` range: a secret added and removed again
      # inside one push is not seen here (trivy has no commit-range secret
      # mode, and there is no ref to skip, so the zero-SHA case needs no
      # special handling). GitHub's own secret scanning — on by
      # default for public repositories, and configured by
      # `.github/secret_scanning.yml` — covers both of those, so the two are
      # complementary: the native scanner has the history and raises the alert,
      # this step fails the PR (or the push) while the secret is still in the tree.
      - name: Scan for secrets
        run: |
          trivy fs \
            --scanners secret \
            --exit-code 1 \
            --no-progress \
            --disable-telemetry \
            --skip-version-check \
            --skip-dirs .git \
            --skip-dirs target \
            --skip-dirs vendor \
            --skip-dirs mutants.out \
            --skip-dirs .planning/slugaudit \
            .
      # `.planning/slugaudit/` is the runtime state directory: a disposable
      # SQLite index holding the full source text of whatever project was
      # indexed. It is gitignored, so it is normally absent from a CI checkout;
      # the skip means even a force-added copy is never read, so a developer's
      # local index cannot be uploaded by this step. (Checked by hand: a planted
      # token under that directory is reported without the flag and absent with
      # it.)
