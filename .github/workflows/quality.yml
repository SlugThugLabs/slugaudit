name: Rust quality

# Every third-party `uses:` in this file is pinned to the full commit SHA behind
# its release tag, with the version kept as a trailing comment so a human can
# still read what is pinned. A tag is a name its owner can repoint at any commit;
# a SHA cannot be repointed. `.github/dependabot.yml` is what proposes the next
# pin, which is why the comment form matters — Dependabot rewrites both together.
#
# `check_performance` is deliberately NOT in this file. It is a local gate: see
# the comment above the test step for the reason.

on:
  push:
  pull_request:

permissions:
  # Least privilege for what this job actually does: it checks out the
  # repository and runs commands. The `checks: write` this block used to carry
  # existed for `rustsec/audit-check`'s check run, and went with that step
  # (2026-09-30) — nothing else here writes a check, a comment, or a release.
  contents: read

jobs:
  quality:
    name: Rust 1.97.1 quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the no-duplicates check can scan every commit
          # subject (a shallow clone would only see the tip commit).
          fetch-depth: 0

      # dtolnay/rust-toolchain publishes no release tags — the action's versions
      # *are* its branches (`stable`, `nightly`, `master`) — so `master` was the
      # moving ref this repository tracked before the pin. The SHA below is the
      # commit that ref resolved to on 2026-09-30. That also means Dependabot
      # cannot bump this one: there is no release tag to compare against, so
      # re-pinning it is a deliberate manual act.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master (branch; no releases)
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, llvm-tools-preview

      # tree-sitter-language-pack's build.rs downloads a ~450 MB parser-
      # sources tarball from GitHub releases at build time whenever its
      # OUT_DIR cache is empty (confirmed locally: a from-scratch build logs
      # "Downloading parser sources from
      # https://github.com/xberg-io/tree-sitter-language-pack/releases/...").
      # That is a distinct concern from the runtime "parser-pack cache miss"
      # surfaced in tool response metadata (src/model/parser.rs's
      # `ParserAvailability::Cached` / `Downloaded`), which only describes
      # an already-running server's own grammar loading, not this crate's
      # build. Swatinem/rust-cache keys its cache on Cargo.lock (plus job
      # context) and caches the whole `target/` tree, including build-script
      # OUT_DIRs — a hand-rolled `actions/cache` step can't target the
      # download directory directly because its path includes a
      # build-hash segment that isn't stable across cache keys.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check source limits
        run: cargo run --quiet --bin check_source_limits --locked

      # Fails when a commit subject is used more than once in reachable
      # history (a repeated subject is the fingerprint of the same logical
      # change being committed twice) or when two test functions share a
      # name across files (usually a copy-pasted test).
      - name: Check for duplicate commit subjects and test names
        run: cargo run --quiet --bin check_no_duplicates --locked

      - name: Check docs drift (canonical doc set, module map, test counts)
        run: cargo run --quiet --bin check_docs_drift --locked

      # Fails when an `EvidenceKind` variant has no producer, or an
      # `ExtractionCompleteness` variant is unreachable — the class Phase 1
      # found by hand (three dead evidence kinds, `ContentOnly` never
      # constructed) and Phase 3 deleted ad hoc.
      - name: Check producer coverage (every evidence kind is constructed)
        run: cargo run --quiet --bin check_producer_coverage --locked

      # Fails when the tools/list or resources/list surface drifts from the
      # committed snapshot (names, titles, descriptions, input and output
      # schemas, annotations, the resource catalogue). Re-record a
      # deliberate change with `--record`, in the style of
      # check_performance.
      - name: Check the MCP surface snapshot (tools/list + resources/list)
        run: cargo run --quiet --bin check_mcp_surface --locked

      # Fails when the governance shell (CODEOWNERS, CONTRIBUTING.md,
      # SECURITY.md, CODE_OF_CONDUCT.md, CHANGELOG.md) is missing a file, or
      # when a CODEOWNERS rule references a path that does not exist.
      - name: Check governance (required files + CODEOWNERS paths)
        run: cargo run --quiet --bin check_governance --locked

      # Fails when Cargo.toml, lhm.plugin.json, the newest CHANGELOG.md
      # heading, or parse::PACK_VERSION disagree on a version.
      - name: Check version consistency (manifests, CHANGELOG, pack pin)
        run: cargo run --quiet --bin check_version_consistency --locked

      - name: Check compilation
        run: cargo check --all-targets --all-features --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # --lib --bins --tests excludes the criterion bench binaries
      # (harness = false) on purpose: `check_performance` is a LOCAL-ONLY gate
      # and CI does not run it, so no bench executes here or anywhere else in
      # this workflow.
      #
      # Why not: `check_performance` compares criterion medians against
      # `.planning/archive/perf_baseline.json`, and that baseline records the
      # machine that measured it ("AMD Ryzen 9 5900X (6 cores visible), Linux
      # 6.17.13-3-pve, rustc 1.97.1", recorded 2026-08-10). A GitHub-hosted
      # runner is a different, shared, unpinned CPU of an unknown generation, so
      # its medians differ from the baseline for reasons that have nothing to do
      # with the commit, and the 20 percent allowance would then be measuring the
      # runner: false failures on a slow neighbour, and silent passes on a fast
      # one. The gate's value is a same-machine before/after comparison, which is
      # exactly what running it locally gives you — see AGENTS.md and README.md
      # for the command.
      #
      # (An earlier revision of this comment referred to "the dedicated
      # performance gate below". There was no such gate; it was never added.)
      - name: Run tests
        run: cargo test --lib --bins --tests --all-features --locked

      # tests/stdio_protocol.rs spawns the compiled binary and speaks real
      # JSON-RPC/MCP over its stdio pipes — the only test in the suite that
      # exercises the actual transport rather than calling Rust functions
      # directly. It's already covered by the "Run tests" step above; this
      # step re-runs it alone so a regression here shows up as its own
      # failing, individually named CI check instead of requiring someone to
      # expand the bulk test log to notice it.
      - name: Real stdio protocol handshake
        run: cargo test --test stdio_protocol --locked

      - name: Build release binary
        run: cargo build --release --locked

      # Linux-only: cargo-deny-action is a container action, and GitHub runs
      # container actions only on Linux runners (macOS fails with "Container
      # action is only supported on Linux", run 38987902197, 2026-10-17). The
      # verdict is about Cargo.lock and deny.toml, which are the same on every
      # OS, so the Linux job's run covers the macOS job too.
      - name: Check dependency advisories, bans, sources, and licenses
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans sources licenses

      # The fuzz/ directory is a separate cargo workspace with its own
      # lockfile, so the root check above cannot see it. Without this step a
      # rustsec-pinned version can sit in fuzz/Cargo.lock unnoticed while the
      # dependency gate reports green — exactly how rustls 0.23.45 (RUSTSEC-2026-0349)
      # survived there. Same deny.toml policy, second workspace.
      - name: Check fuzz workspace dependencies
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check advisories bans sources licenses

      # cargo-geiger transitive-unsafe review policy (see README.md's
      # "Unsafe code policy" section): `#![forbid(unsafe_code)]` gives a
      # hard, compiler-enforced 0/0 guarantee for slugaudit-mcp-rust's own
      # source, so that half needs no CI gate at all. Transitive unsafe in
      # dependencies performing FFI/syscalls/cryptography (tree-sitter,
      # rusqlite's bundled SQLite, tokio, ring/rustls) is expected and is
      # reviewed by hand whenever a new dependency is added, rather than
      # gated here — cargo-geiger's own output is noisy (unrelated
      # deprecation/lint warnings from every transitive crate it scans) and
      # its metric counts have no natural pass/fail threshold. This is a
      # deliberate scope decision, not a gap to fill in later.

      # RustSec advisories are covered by the `cargo-deny` step above: both read
      # the same RustSec advisory-database, and `deny.toml`'s
      # `[advisories] ignore = []` suppresses nothing, so the two verdicts could
      # not disagree. The `rustsec/audit-check` step that used to sit here was
      # removed on 2026-09-30 rather than left in place, because it could not
      # run: its newest release (v2.0.0, still the tip of the upstream `v2`
      # branch) declares `runs.using: node20`, Node 20 was removed from
      # GitHub-hosted runners on 2026-09-23, and the
      # `ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION` escape hatch was deactivated at
      # the same time. A security step that cannot execute is worse than no step,
      # because it still reads as coverage. Re-add it here (with
      # `checks: write` back on the job) when upstream ships a node24 release.
      # Scheduled advisory runs live in `.github/workflows/advisories.yml`.

      - name: Install coverage tooling
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      # Line coverage is gated by the `check_coverage` bin, which reads the
      # merged JSON line coverage (totals.lines.percent — the metric
      # --fail-under-lines compares) and prints it, so the gated number is
      # never ambiguous. The --summary-only text table prints region-
      # weighted columns that have been misread as line coverage before;
      # the bin reads the JSON report instead. Recalibrate the threshold
      # in the bin deliberately as real coverage moves — it is not an
      # aspirational target picked in advance.
      - name: Coverage (cargo llvm-cov)
        run: cargo run --quiet --bin check_coverage --locked

      - name: Install mutation testing tooling
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants

      # SCOPE DECISION — six files on purpose. The plan's *Untrusted-input
      # rigor* item asked for either a wider mutation scope or a written
      # reason for this one; this comment is the written reason, and
      # AGENTS.md's "Testing and QA" section (Mutation testing) carries the
      # same decision for readers who never open this file.
      #
      # What the six are: `src/sync/revision.rs` and `src/sync/publish.rs`
      # decide revision identity and atomic publication, `src/sync/hash.rs`
      # owns the hash types and in-memory digests, `src/sync/hash_io.rs`
      # carries the streaming `hash_file` and `stat_identity` that moved out
      # of `hash.rs` in the wave-3 R4 split (2026-10-19),
      # `src/sync/revision_support.rs` carries the stale-finding
      # invalidation (`invalidate_stale_findings`) that moved out of
      # `revision.rs` in the wave-4 size fix (2026-10-19), and
      # `src/tools/context.rs` is the freshness-verification entry point
      # every state-bearing tool handler shares. A mutant that survives in
      # any of them means a revision was published wrong or a stale one was
      # served — the one class of defect no other file can produce, which is
      # why these six and not the whole crate. Neither moved file is a
      # widening: hash_io and revision_support hold the same
      # correctness-core functions at their new paths.
      #
      # What widening would cost, measured with `cargo mutants --list` on
      # 2026-09-30: the original four files hold 23 of the crate's 2323
      # mutants (~1 percent). All of `src/sync/**` is 310 and all of
      # `src/tools/**` is 484, so widening to either is a 13x / 21x
      # multiplier on this step — cargo-mutants rebuilds the crate and
      # re-runs the whole test suite once per mutant, so the step costs
      # mutant count x suite time, not a one-off. The mutants a wider scope
      # adds are in code the existing suites already drive end to end
      # (`discovery_tests`, `sample_tests`, `sweep_tests`, `publish_*_tests`,
      # the `tools/*_tests` suites), so that multiplier buys verdicts on
      # behavior the tests pin directly, while the six files above are
      # where a mutation can slip past a green suite.
      #
      # This step FAILS CLOSED: the 2026-08-12 baseline recorded zero
      # surviving mutants on the pre-split four-file surface (17 caught, 0
      # missed, 3 unviable; see .planning/archive/DECISIONS.md). The wave-3
      # split moved the hash functions to hash_io.rs and the wave-4 size fix
      # moved stale-finding invalidation to revision_support.rs, both
      # without changing them, so a survivor in the six-file scope is a real
      # regression, not an un-triaged baseline.
      #
      # Linux-only: cargo-mutants has platform-specific behavior and the
      # baseline was recorded on Linux.
      - name: Mutation testing (revision, revision_support, publish, hash, hash_io, context)
        if: runner.os == 'Linux'
        run: |
          cargo mutants \
            --file src/sync/revision.rs \
            --file src/sync/revision_support.rs \
            --file src/sync/publish.rs \
            --file src/sync/hash.rs \
            --file src/sync/hash_io.rs \
            --file src/tools/context.rs
