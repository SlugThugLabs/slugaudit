# GitHub secret scanning — repository configuration.
#
# Secret scanning is a repository feature, not a workflow: it is enabled by
# default for public repositories (this one is public), it scans the default
# branch and its history, and it needs no action pinned and no permission
# granted. This file is the part of it that lives in source control.
#
# The exclusion below is the runtime state directory. `<project>/.planning/
# slugaudit/` holds the disposable SQLite index and its sidecars — derived data,
# but derived data that contains the *full source text* of every file that was
# indexed, which is exactly the kind of content that must never be uploaded
# anywhere. It is gitignored (`.gitignore` -> `/.planning/slugaudit/`), so it is
# normally not in the repository at all; the case this pattern covers is the one
# where that guarantee is bypassed — a `git add -f`, a tool that does not honour
# `.gitignore`, or a commit made before the ignore rule existed. Excluded here,
# a developer's local index is never submitted to the scanner and can never
# raise an alert.
#
# Pattern syntax is GitHub's standard filter-pattern globbing, and `paths-ignore`
# suppresses alerts for matching paths (up to 1,000 entries; this file is far
# under the 1 MB limit).
paths-ignore:
  - ".planning/slugaudit/**"
